# Déclenchement MANUEL uniquement (bouton « Run workflow » dans GitHub > Actions), pour tester un envoi d'alertes.
# Les alertes automatiques passent désormais par les crons Vercel Pro (vercel.json, toutes les 15 min en heures de bourse) :
# ne pas remettre de « schedule » ici, sinon les alertes seraient vérifiées deux fois.
# Secrets GitHub nécessaires : CRON_SECRET (même valeur que sur Vercel), APP_URL facultatif (https://kapitaro.fr par défaut).
name: Alertes de prix
on:
  workflow_dispatch: {}
jobs:
  alerts:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Vérifier les seuils d'alerte
        run: |
          APP_URL="$(echo "${APP_URL:-https://kapitaro.fr}" | tr -d '[:space:]')"
          APP_URL="${APP_URL%/}"
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Le secret CRON_SECRET est absent. GitHub > Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "Appel de $APP_URL/api/push-send?mode=alerts"
          code=$(curl --silent --show-error --max-time 60 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/push-send?mode=alerts")
          echo "Statut HTTP : $code"
          cat response.json; echo
          if [ "$code" = "401" ]; then echo "::error::401 : CRON_SECRET différent de celui de Vercel (ou absent sur Vercel)."; fi
          [ "$code" = "200" ]
