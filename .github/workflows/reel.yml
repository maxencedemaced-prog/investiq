# Vidéo animée (Reel) d'un post du Studio : lancée automatiquement par api/social.js (action « reel-create »).
# Rend la vidéo avec Remotion (dossier video/), l'envoie dans le stockage Supabase et met à jour le post.
# Secret GitHub nécessaire : SUPABASE_SERVICE_KEY (même valeur que sur Vercel). Facultatif : PEXELS_API_KEY (vidéos d'illustration).
name: Vidéo animée (Reel)
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Identifiant du post (social_posts.id)
        required: true
concurrency:
  group: reel-${{ inputs.post_id }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Fabrication de la vidéo
        env:
          POST_ID: ${{ inputs.post_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node render-job.mjs
