# Vidéo tutoriel : lancée depuis le Studio (action « tuto-create » de api/social.js, après la voix off ElevenLabs).
# Enregistre l'appli de cette branche en mode démo (Playwright, format téléphone), ajoute la voix, envoie le MP4 dans le stockage Supabase.
# Secrets GitHub utilisés : SUPABASE_SERVICE_KEY, APP_URL (SUPABASE_URL facultatif).
name: Vidéo tutoriel
on:
  workflow_dispatch:
    inputs:
      tuto_id:
        description: Identifiant du tutoriel (api/_tuto.js)
        required: true
      variant:
        description: mobile ou desktop
        required: false
        default: mobile
concurrency:
  group: tuto-${{ inputs.tuto_id }}-${{ inputs.variant }}
  cancel-in-progress: true
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tuto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Les installations réessaient : pendant un incident GitHub, un téléchargement peut échouer une première fois
      - name: Polices (emojis) et ffmpeg
        run: for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji fonts-dejavu ffmpeg && break || sleep 20; done
      - name: Dépendances
        run: for i in 1 2 3; do npm install --no-audit --no-fund && break || sleep 20; done
      - name: Navigateur
        run: for i in 1 2 3; do npx playwright install --with-deps chromium && break || sleep 20; done
      - name: Enregistrement de la vidéo
        env:
          TUTO_ID: ${{ inputs.tuto_id }}
          VARIANT: ${{ inputs.variant }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node record.mjs
      # Échec avant ou pendant l'enregistrement : on l'écrit dans le Studio (sinon il afficherait « en attente » indéfiniment).
      # Une annulation n'écrit rien : c'est souvent un nouveau clic qui remplace celle-ci, et elle effacerait l'état de la nouvelle.
      - name: Signaler l'échec au Studio
        if: failure()
        env:
          TUTO_ID: ${{ inputs.variant == 'desktop' && format('{0}__desktop', inputs.tuto_id) || inputs.tuto_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          BASE="${SUPABASE_URL:-https://soyyznyceqzimhoaffaw.supabase.co}"
          STATE=error; MSG="La fabrication a échoué sur GitHub (souvent un incident passager). Relance le tournage : la voix est conservée."
          printf '{"state":"%s","step":"%s","error":"%s","run":"%s","at":"%s"}' "$STATE" "$MSG" "$MSG" "$RUN_URL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/st.json
          curl -s -X POST "$BASE/storage/v1/object/social/tuto/status/$TUTO_ID.json" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" -H "apikey: $SUPABASE_SERVICE_KEY" -H "x-upsert: true" -H "Content-Type: application/json" --data-binary @/tmp/st.json
