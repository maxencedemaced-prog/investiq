# Compilation de l'appli iOS sur les Mac de Codemagic (aucun Mac nécessaire chez nous).
# Certificat et profil sont enregistrés dans Codemagic (kapitaro-distribution, kapitaro-app-store), valables jusqu'au 07/11/2027.
workflows:
  ios-testflight:
    name: Kapitaro iOS vers TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: ios-app
    integrations:
      app_store_connect: Kapitaro
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.kapitaro.app
      xcode: latest
      node: 20
    triggering:
      events: []
    scripts:
      - name: Installer Capacitor
        script: npm install
      - name: Créer le projet iOS
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Lien de retour de connexion (fr.kapitaro.app://)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string fr.kapitaro.app" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string fr.kapitaro.app" "$PLIST"
      - name: Connexion par la méthode système d'Apple (KpAuth)
        script: |
          DELEGATE=ios/App/App/AppDelegate.swift
          BOARD=ios/App/App/Base.lproj/Main.storyboard
          cat "$DELEGATE" KpAuth.swift > "$DELEGATE.new"
          mv "$DELEGATE.new" "$DELEGATE"
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="KpBridgeViewController" customModule="App" customModuleProvider="target"/' "$BOARD"
          grep -q 'customClass="KpBridgeViewController"' "$BOARD"
      - name: Notifications Apple (droit aps-environment)
        script: |
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" ios/App/App/App.entitlements
          sed -i '' 's|INFOPLIST_FILE = App/Info.plist;|CODE_SIGN_ENTITLEMENTS = App/App.entitlements; INFOPLIST_FILE = App/Info.plist;|g' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements' ios/App/App.xcodeproj/project.pbxproj
      - name: Icône Kapitaro et déclaration de chiffrement
        script: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          cp icon-1024.png "$ICON"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Numéro de version
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Signature
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Compiler
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
